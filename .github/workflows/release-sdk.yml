name: Release SDK profiles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v5.0.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-sdk-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and publish
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            echo "Update package.json/package-lock.json or use tag $EXPECTED_TAG"
            exit 1
          fi

      - name: Run TypeScript checks
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Verify Lua against Redis
        run: npm run test:redis

      - name: Build installable profiles
        run: npm run build

      - name: Verify release files
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          for PROFILE in example ssi kyc; do
            FILE="hypersign-protocol-credit-middleware-${PACKAGE_VERSION}-${PROFILE}.tgz"
            if [ ! -s "$FILE" ]; then
              echo "Missing release file: $FILE"
              exit 1
            fi
          done

      - name: Create GitHub Release and upload profiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXAMPLE_FILE="hypersign-protocol-credit-middleware-${PACKAGE_VERSION}-example.tgz"
          SSI_FILE="hypersign-protocol-credit-middleware-${PACKAGE_VERSION}-ssi.tgz"
          KYC_FILE="hypersign-protocol-credit-middleware-${PACKAGE_VERSION}-kyc.tgz"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "Credit Middleware ${PACKAGE_VERSION}" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" \
            "$EXAMPLE_FILE" \
            "$SSI_FILE" \
            "$KYC_FILE" \
            --clobber
